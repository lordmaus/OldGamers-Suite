name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION: OldGamers.Suite.slnx
  # dotnet build only READS <app>\version.txt (Directory.Build.props); only build.bat bumps it.
  BUILD_PROPS: -p:ContinuousIntegrationBuild=true

jobs:
  themes:
    name: Theme contrast (WCAG AAA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check themes for each app
        shell: bash
        run: |
          rc=0
          for app in BadgeOverlay FileCopy NoteStation ReticleOverlay SuperMagnifierLV TimerStudio; do
            echo "::group::$app"
            python3 -I Tools/check_theme_contrast.py --app-dir "$app" || { echo "::error title=Theme contrast::$app failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  build-test:
    name: Build + test (Release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore ${{ env.BUILD_PROPS }}

      - name: Verify exe version = version.txt
        shell: pwsh
        run: |
          $apps = [ordered]@{ BadgeOverlay='BadgeOverlay'; FileCopy='FileCopyStudio'; NoteStation='NoteStation'
                              ReticleOverlay='ReticleOverlay'; SuperMagnifierLV='SuperMagnifierLV'; TimerStudio='TimerStudio' }
          $bad = 0
          foreach ($dir in $apps.Keys) {
            $want = (Get-Content "$dir/version.txt" -Raw).Trim()
            $dll  = Get-ChildItem "$dir/bin/Release" -Recurse -Filter "$($apps[$dir]).dll" | Select-Object -First 1
            if (-not $dll) { Write-Output "::error title=Version $dir::$($apps[$dir]).dll not found"; $bad++; continue }
            $vi   = $dll.VersionInfo
            $info = $vi.ProductVersion.Split('+')[0]
            if ([version]$vi.FileVersion -ne [version]$want -or $info -ne $want) {
              Write-Output "::error title=Version $dir::version.txt=$want, FileVersion=$($vi.FileVersion), ProductVersion=$($vi.ProductVersion)"
              $bad++
            } else { Write-Output "$dir $want OK" }
          }
          exit $bad

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build ${{ env.BUILD_PROPS }}
          --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue
          if (-not $files) { Write-Output "::error title=Tests::No .trx produced (test run did not start)"; exit 0 }
          $summary = @("## Failed tests", "")
          foreach ($f in $files) {
            [xml]$x = Get-Content $f.FullName -Raw
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            $counters = Select-Xml -Xml $x -XPath '//t:Counters' -Namespace $ns | Select-Object -First 1
            if ($counters) { $c = $counters.Node; Write-Output "::notice title=$($f.Name)::total=$($c.total) passed=$($c.passed) failed=$($c.failed)" }
            foreach ($r in (Select-Xml -Xml $x -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns)) {
              $n = $r.Node
              $msg = ($n.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
              Write-Output "::error title=$($n.testName)::$msg"
              $summary += "- **$($n.testName)**: $msg"
            }
          }
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload app builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ github.sha }}
          path: |
            BadgeOverlay/bin/Release/
            FileCopy/bin/Release/
            NoteStation/bin/Release/
            ReticleOverlay/bin/Release/
            SuperMagnifierLV/bin/Release/
            TimerStudio/bin/Release/
          if-no-files-found: error
          retention-days: 14

  installers:
    name: build.bat + installer (${{ matrix.app }})
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [BadgeOverlay, FileCopy, NoteStation, ReticleOverlay, SuperMagnifierLV, TimerStudio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      # The same build.bat you run locally: bumps version.txt (CI copy only), publishes, builds the Setup.
      - name: build.bat
        working-directory: ${{ matrix.app }}
        shell: cmd
        run: call build.bat

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-${{ matrix.app }}
          path: ${{ matrix.app }}/**/*_Setup.exe
          if-no-files-found: error
          retention-days: 14
